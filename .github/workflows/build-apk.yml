name: Build Android APK (Expo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Expo SDK 58 membutuhkan Node ^22.13 (atau 24.3+)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Folder android/ dibuat ulang dari app.json + config plugin (CNG)
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install --clean

      # Versi Gradle ditentukan oleh wrapper hasil prebuild (jangan pakai gradle global)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # APK release: JavaScript sudah tertanam (tidak perlu Metro/expo start).
      # Ditandatangani dengan debug keystore bawaan template, cukup untuk uji di HP.
      - name: Build Android APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duitku-release-apk
          path: android/app/build/outputs/apk/release/*.apk
